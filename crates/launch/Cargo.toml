[package]
name = "steam-config-launch"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[[bin]]
name = "steam-config-launch"
path = "src/main.rs"

[dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
steam-config-vdf = { path = "../vdf" }
