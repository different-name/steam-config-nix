name: update-flake-lock

on:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.FLAKE_LOCK_PAT }}
      - uses: DeterminateSystems/nix-installer-action@v22

      - name: update root inputs
        run: nix flake update 2>> lock-changes.txt

      - name: update docs partition inputs
        run: nix flake update --flake ./docs 2>> lock-changes.txt

      - name: open pull request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.FLAKE_LOCK_PAT }}
          add-paths: |
            flake.lock
            docs/flake.lock
          title: "chore: update flake inputs"
          commit-message: "chore: update flake inputs"
          branch: update-flake-lock
          body-path: lock-changes.txt
